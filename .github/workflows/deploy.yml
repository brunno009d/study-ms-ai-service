name: Build and Push AI Service to ACR

on:
  push:
    branches:
      - main

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run tests
        env:
          GEMINI_API_KEY: placeholder-gemini-key
          OPENROUTER_API_KEY: placeholder-openrouter-key
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_KEY: placeholder-service-key
          USER_SERVICE_URL: http://localhost:3001
          CURRICULUM_SERVICE_URL: http://localhost:3002
          GRADES_SERVICE_URL: http://localhost:3003
          CALENDAR_SERVICE_URL: http://localhost:3004
          NOTES_SERVICE_URL: http://localhost:3005
        run: python -m pytest tests/ -v

  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    needs: test

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v1
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.ACR_LOGIN_SERVER }}/ms-ai-service:${{ github.sha }} -t ${{ secrets.ACR_LOGIN_SERVER }}/ms-ai-service:latest .

    - name: Push Docker Image to ACR
      run: |
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/ms-ai-service:${{ github.sha }}
        docker push ${{ secrets.ACR_LOGIN_SERVER }}/ms-ai-service:latest
